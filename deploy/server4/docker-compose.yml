name: ott-server4

services:
  detection-engine:
    build:
      context: ../../detection/engine
    container_name: ott-detection-engine-central
    environment:
      LOG_SOURCE: elasticsearch
      ELASTICSEARCH_URL: http://192.168.0.120:9200
      ELASTICSEARCH_INDEX: scrubber-nginx-*,filebeat-*,.ds-scrubber-nginx-*,.ds-filebeat-*
      NEO4J_URI: bolt://192.168.0.120:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ott_detection_2025
      NEO4J_DATABASE: neo4j
    restart: unless-stopped
