env EDGE_ID;
env VERIFY_API_URL;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Do not trust client-supplied X-Forwarded-For in this topology.
    # Use remote_addr by default, and allow explicit real_ip only for controlled simulation.
    map "$arg_real_ip:$remote_addr" $client_real_ip {
        default $remote_addr;
        "~^([^:]+):.*" $1;
    }

    map $client_real_ip $client_region {
        default "UNKNOWN";
        "~^192\.168\.0\.1[1-9]$" "KR";
        "~^192\.168\.0\.2[1-9]$" "JP";
        "~^192\.168\.0\.3[1-9]$" "SG";
        "~^192\.168\.0\.4[1-9]$" "US";
    }

    map $upstream_cache_status $cache_status {
        default $upstream_cache_status;
        "" "-";
    }

    log_format cdn_detection '{'
                            '"timestamp":"$time_iso8601",'
                            '"client_ip":"$client_real_ip",'
                            '"client_region":"$client_region",'
                            '"edge_server":"$edge_server",'
                            '"remote_addr":"$remote_addr",'
                            '"x_forwarded_for":"$http_x_forwarded_for",'
                            '"request_method":"$request_method",'
                            '"uri":"$uri",'
                            '"request_uri":"$request_uri",'
                            '"query_string":"$query_string",'
                            '"status":"$status",'
                            '"bytes_sent":"$bytes_sent",'
                            '"response_time_ms":"$request_time",'
                            '"token_user_id":"$token_user_id",'
                            '"token_session_id":"$token_session_id",'
                            '"token_content_id":"$token_content_id",'
                            '"token_expires":"$token_expires",'
                            '"token_valid":"$token_valid",'
                            '"token_edge_match":"$token_edge_match",'
                            '"token_label":"$token_label",'
                            '"token_run_id":"$token_run_id",'
                            '"token_scenario_id":"$token_scenario_id",'
                            '"token_dataset_label":"$token_dataset_label",'
                            '"http_referer":"$http_referer",'
                            '"http_user_agent":"$http_user_agent",'
                            '"session_token":"$arg_token",'
                            '"content_id":"$arg_content_id",'
                            '"username":"$arg_user",'
                            '"user_id":"$arg_user_id",'
                            '"client_id":"$arg_client_id",'
                            '"upstream_response_time":"$upstream_response_time",'
                            '"connection":"$connection",'
                            '"connection_requests":"$connection_requests",'
                            '"http_range":"$http_range",'
                            '"range_header":"$http_range",'
                            '"cache_status":"$cache_status",'
                            '"request_id":"$msec-$connection-$connection_requests",'
                            '"http_connection":"$http_connection",'
                            '"http_accept":"$http_accept",'
                            '"http_accept_language":"$http_accept_language"'
                            '}';

    access_log /var/log/nginx/access.log cdn_detection;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    geo $blocked_ip {
        default 0;
    }

    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $arg_token zone=by_token:10m rate=50r/s;
    proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:20m max_size=2g inactive=15m use_temp_path=off;

    upstream origin_backend {
        server 192.168.0.100:8080;
        keepalive 32;
    }

    upstream scrubber_api {
        server 192.168.0.100:3001;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS, POST' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Scenario-Label, Range' always;
        add_header Access-Control-Max-Age 3600 always;

        # Hide upstream CORS headers to avoid duplicate Access-Control-* on proxied responses.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Expose-Headers;

        set_by_lua_block $edge_server {
            return os.getenv("EDGE_ID") or "edge-unknown"
        }
        set $token_user_id "-";
        set $token_session_id "-";
        set $token_content_id "-";
        set $token_expires "-";
        set $token_valid "false";
        set $token_edge_match "false";
        set $token_label "normal";
        set $token_run_id "-";
        set $token_scenario_id "-";
        set $token_dataset_label "-";

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        if ($blocked_ip) {
            return 403;
        }

        limit_req zone=general burst=20 nodelay;

        # Live manifest is updated frequently, so keep cache very short.
        location ~ ^/hls/live_.*/(master\.m3u8|.*/playlist\.m3u8)$ {
            access_by_lua_file /usr/local/openresty/nginx/lua/auth_check.lua;
            limit_req zone=by_token burst=10 nodelay;

            proxy_cache cdn_cache;
            proxy_cache_valid 200 1s;
            proxy_cache_use_stale updating;

            proxy_pass http://origin_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header X-Session-Token $http_x_session_token;
            proxy_set_header X-Content-ID $http_x_content_id;
            proxy_set_header X-User-ID $token_user_id;
            proxy_set_header X-Playback-Session $token_session_id;
        }

        # Live segments are immutable once written, so longer cache is safe.
        location ~ ^/hls/live_.*/.*/seg_.*\.ts$ {
            access_by_lua_file /usr/local/openresty/nginx/lua/auth_check.lua;
            limit_req zone=by_token burst=10 nodelay;

            proxy_cache cdn_cache;
            proxy_cache_valid 200 300s;
            proxy_cache_use_stale updating;

            proxy_pass http://origin_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header X-Session-Token $http_x_session_token;
            proxy_set_header X-Content-ID $http_x_content_id;
            proxy_set_header X-User-ID $token_user_id;
            proxy_set_header X-Playback-Session $token_session_id;
        }

        location /hls {
            access_by_lua_file /usr/local/openresty/nginx/lua/auth_check.lua;
            limit_req zone=by_token burst=10 nodelay;

            proxy_pass http://origin_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header X-Session-Token $http_x_session_token;
            proxy_set_header X-Content-ID $http_x_content_id;
            proxy_set_header X-User-ID $token_user_id;
            proxy_set_header X-Playback-Session $token_session_id;

            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
        }

        location /thumbnails {
            proxy_pass http://origin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location /api {
            proxy_pass http://scrubber_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"scrubber-gateway"}';
            add_header Content-Type application/json;
        }

        location / {
            return 200 '{"message":"Scrubber Gateway","version":"1.1","topology":"physical-edge-split"}';
            add_header Content-Type application/json;
        }
    }
}
