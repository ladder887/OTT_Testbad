name: ott-server2

services:
  edge-kr:
    build:
      context: ../../scrubber
      dockerfile: Dockerfile.gateway
    container_name: edge-kr
    environment:
      EDGE_ID: edge-kr
      VERIFY_API_URL: http://192.168.0.100:3001/api/playback/verify
    ports:
      - "8081:80"
    volumes:
      - ./nginx.remote.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../../scrubber/lua:/usr/local/openresty/nginx/lua:ro
      - edge_logs:/var/log/nginx
    restart: unless-stopped

  edge-jp:
    build:
      context: ../../scrubber
      dockerfile: Dockerfile.gateway
    container_name: edge-jp
    environment:
      EDGE_ID: edge-jp
      VERIFY_API_URL: http://192.168.0.100:3001/api/playback/verify
    ports:
      - "8082:80"
    volumes:
      - ./nginx.remote.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../../scrubber/lua:/usr/local/openresty/nginx/lua:ro
      - edge_logs:/var/log/nginx
    restart: unless-stopped

  edge-sg:
    build:
      context: ../../scrubber
      dockerfile: Dockerfile.gateway
    container_name: edge-sg
    environment:
      EDGE_ID: edge-sg
      VERIFY_API_URL: http://192.168.0.100:3001/api/playback/verify
    ports:
      - "8083:80"
    volumes:
      - ./nginx.remote.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../../scrubber/lua:/usr/local/openresty/nginx/lua:ro
      - edge_logs:/var/log/nginx
    restart: unless-stopped

  edge-us:
    build:
      context: ../../scrubber
      dockerfile: Dockerfile.gateway
    container_name: edge-us
    environment:
      EDGE_ID: edge-us
      VERIFY_API_URL: http://192.168.0.100:3001/api/playback/verify
    ports:
      - "8084:80"
    volumes:
      - ./nginx.remote.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../../scrubber/lua:/usr/local/openresty/nginx/lua:ro
      - edge_logs:/var/log/nginx
    restart: unless-stopped

  detection-engine:
    build:
      context: ../../detection/engine
    container_name: ott-detection-engine
    environment:
      NEO4J_URI: bolt://192.168.0.120:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ott_detection_2025
    volumes:
      - edge_logs:/var/log/scrubber:ro
    depends_on:
      - edge-kr
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: ott-filebeat-edge
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - edge_logs:/var/log/scrubber:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - edge-kr
    restart: unless-stopped

volumes:
  edge_logs:
  filebeat_data:
