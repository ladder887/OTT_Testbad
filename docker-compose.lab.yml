name: ott-testbed

services:
  postgres:
    image: postgres:15-alpine
    container_name: ott-postgres
    environment:
      POSTGRES_DB: ott_auth
      POSTGRES_USER: ott_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.lab}"
      OTT_ADMIN_PASSWORD: "${OTT_ADMIN_PASSWORD:?Set OTT_ADMIN_PASSWORD in .env.lab}"
      OTT_TEST_PASSWORD: "${OTT_TEST_PASSWORD:?Set OTT_TEST_PASSWORD in .env.lab}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./01_platform/03_database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ott_user -d ott_auth"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: ott-neo4j
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.lab}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ott-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  origin-nginx:
    image: nginx:1.25-alpine
    container_name: ott-origin-nginx
    ports:
      - "8080:80"
    volumes:
      - ./01_platform/01_origin/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./01_platform/01_origin/hls:/var/www/hls:ro
      - ./01_platform/01_origin/thumbnails:/var/www/thumbnails:ro
      - ./01_platform/01_origin/html:/usr/share/nginx/html:ro
      - origin_logs:/var/log/nginx
    restart: unless-stopped

  live-encoder:
    image: linuxserver/ffmpeg:latest
    container_name: ott-live-encoder
    environment:
      LIVE_SOURCE_FILE: /source/sample.mp4
    volumes:
      - ./01_platform/01_origin/hls:/var/www/content
      - ./01_platform/01_origin/source:/source
    entrypoint: /bin/sh
    command: |
      -lc '
      set -e;
      SRC="$${LIVE_SOURCE_FILE:-/source/sample.mp4}";
      mkdir -p /var/www/content/live_001/1080p /var/www/content/live_001/720p;
      cat > /var/www/content/live_001/master.m3u8 <<"EOF"
      #EXTM3U
      #EXT-X-STREAM-INF:BANDWIDTH=3128000,RESOLUTION=1920x1080,NAME="1080p"
      1080p/playlist.m3u8
      #EXT-X-STREAM-INF:BANDWIDTH=1596000,RESOLUTION=1280x720,NAME="720p"
      720p/playlist.m3u8
      EOF
      while [ ! -f "$$SRC" ]; do
        echo "Waiting for live source file: $$SRC";
        sleep 5;
      done;
      ffmpeg -re -stream_loop -1 -i "$$SRC" -c:v libx264 -preset ultrafast -b:v 3000k -c:a aac -b:a 128k -f hls -hls_time 2 -hls_list_size 12 -hls_flags delete_segments+append_list+independent_segments+omit_endlist -hls_segment_filename "/var/www/content/live_001/1080p/seg_%05d.ts" "/var/www/content/live_001/1080p/playlist.m3u8" &
      ffmpeg -re -stream_loop -1 -i "$$SRC" -c:v libx264 -preset ultrafast -vf scale=1280:720 -b:v 1500k -c:a aac -b:a 96k -f hls -hls_time 2 -hls_list_size 12 -hls_flags delete_segments+append_list+independent_segments+omit_endlist -hls_segment_filename "/var/www/content/live_001/720p/seg_%05d.ts" "/var/www/content/live_001/720p/playlist.m3u8"
      '
    restart: unless-stopped

  access-api:
    build:
      context: ./01_platform/02_access_gateway/api
    container_name: ott-access-api
    environment:
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: "http://localhost:5173,http://localhost:5174"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ott_auth
      POSTGRES_USER: ott_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.lab}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env.lab}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.lab}"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.lab}"
      MAX_UPLOAD_FILE_SIZE_MB: 2048
      LOGIN_RATE_LIMIT_MAX: 200
      LOGIN_RATE_LIMIT_WINDOW_MS: 900000
      CDN_SHARED_SECRET: "${CDN_SHARED_SECRET:?Set CDN_SHARED_SECRET in .env.lab}"
      EDGE_ID: edge-local
      EDGE_DEFAULT_URL: http://localhost:8081
      EDGE_KR_URL: http://localhost:8081
      EDGE_JP_URL: http://localhost:8081
      EDGE_SG_URL: http://localhost:8081
      EDGE_US_URL: http://localhost:8081
      UPLOAD_SOURCE_DIR: /var/www/source
      UPLOAD_THUMBNAIL_DIR: /var/www/thumbnails
    ports:
      - "3001:3001"
    volumes:
      - ./01_platform/01_origin/hls:/var/www/hls
      - ./01_platform/01_origin/source:/var/www/source
      - ./01_platform/01_origin/thumbnails:/var/www/thumbnails
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      elasticsearch:
        condition: service_started
    restart: unless-stopped

  access-gateway:
    build:
      context: ./01_platform/02_access_gateway
      dockerfile: Dockerfile.gateway
    container_name: ott-access-gateway
    environment:
      EDGE_ID: edge-local
    ports:
      - "8081:80"
    volumes:
      - ./01_platform/02_access_gateway/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./01_platform/02_access_gateway/lua:/usr/local/openresty/nginx/lua:ro
      - access_gateway_logs:/var/log/nginx
      - access_gateway_cache:/var/cache/nginx
    depends_on:
      - origin-nginx
      - access-api
    restart: unless-stopped

  graph-pipeline:
    build:
      context: ./01_platform/05_graph_pipeline/service
    container_name: ott-graph-pipeline
    environment:
      LOG_SOURCE: elasticsearch
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: access-gateway-nginx-*,scrubber-nginx-*,filebeat-*,.ds-access-gateway-nginx-*,.ds-scrubber-nginx-*,.ds-filebeat-*,ott-api-events-*
      ES_POLL_SIZE: 5000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.lab}"
      NEO4J_DATABASE: neo4j
      LOG_LEVEL: INFO
      ENABLE_OPERATIONAL_AUDIT: "false"
      GRAPH_PIPELINE_STATE_FILE: /var/lib/graph-pipeline/checkpoint.json
    volumes:
      - access_gateway_logs:/var/log/access-gateway:ro
      - graph_pipeline_state:/var/lib/graph-pipeline
    depends_on:
      - neo4j
      - elasticsearch
      - access-gateway
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: ott-filebeat
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./01_platform/04_observability/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - access_gateway_logs:/var/log/access-gateway:ro
      - origin_logs:/var/log/origin:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - elasticsearch
      - access-gateway
      - origin-nginx
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: ott-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  origin-web:
    build:
      context: ./01_platform/01_origin/web
    container_name: ott-origin-web
    environment:
      VITE_API_URL: http://localhost:8081
      VITE_API_UPLOAD_URL: http://localhost:3001
      VITE_CDN_URL: http://localhost:8081
    ports:
      - "5173:3000"
    depends_on:
      - access-api
      - access-gateway
    restart: unless-stopped

  access-console:
    build:
      context: ./01_platform/02_access_gateway/console
    container_name: ott-access-console
    environment:
      VITE_API_URL: http://localhost:8081
    ports:
      - "5174:3000"
    depends_on:
      - access-api
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  elasticsearch_data:
  access_gateway_logs:
  access_gateway_cache:
  origin_logs:
  filebeat_data:
  graph_pipeline_state:
