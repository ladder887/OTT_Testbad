name: ott-testbed

services:
  postgres:
    image: postgres:15-alpine
    container_name: ott-postgres
    environment:
      POSTGRES_DB: ott_auth
      POSTGRES_USER: ott_user
      POSTGRES_PASSWORD: ott_password_2025
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ott_user -d ott_auth"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: ott-neo4j
    environment:
      NEO4J_AUTH: neo4j/ott_detection_2025
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ott-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  origin-nginx:
    image: nginx:1.25-alpine
    container_name: ott-origin-nginx
    ports:
      - "8080:80"
    volumes:
      - ./origin/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./origin/hls:/var/www/hls:ro
      - ./origin/thumbnails:/var/www/thumbnails:ro
      - ./origin/html:/usr/share/nginx/html:ro
      - origin_logs:/var/log/nginx
    restart: unless-stopped

  live-encoder:
    image: linuxserver/ffmpeg:latest
    container_name: ott-live-encoder
    environment:
      LIVE_SOURCE_FILE: /source/sample.mp4
    volumes:
      - ./origin/hls:/var/www/content
      - ./origin/source:/source
    entrypoint: /bin/sh
    command: |
      -lc '
      set -e;
      SRC="$${LIVE_SOURCE_FILE:-/source/sample.mp4}";
      mkdir -p /var/www/content/live_001/1080p /var/www/content/live_001/720p;
      cat > /var/www/content/live_001/master.m3u8 <<"EOF"
      #EXTM3U
      #EXT-X-STREAM-INF:BANDWIDTH=3128000,RESOLUTION=1920x1080,NAME="1080p"
      1080p/playlist.m3u8
      #EXT-X-STREAM-INF:BANDWIDTH=1596000,RESOLUTION=1280x720,NAME="720p"
      720p/playlist.m3u8
      EOF
      while [ ! -f "$$SRC" ]; do
        echo "Waiting for live source file: $$SRC";
        sleep 5;
      done;
      ffmpeg -re -stream_loop -1 -i "$$SRC" -c:v libx264 -preset ultrafast -b:v 3000k -c:a aac -b:a 128k -f hls -hls_time 6 -hls_list_size 5 -hls_flags delete_segments+append_list+independent_segments -hls_segment_filename "/var/www/content/live_001/1080p/seg_%05d.ts" "/var/www/content/live_001/1080p/playlist.m3u8" &
      ffmpeg -re -stream_loop -1 -i "$$SRC" -c:v libx264 -preset ultrafast -vf scale=1280:720 -b:v 1500k -c:a aac -b:a 96k -f hls -hls_time 6 -hls_list_size 5 -hls_flags delete_segments+append_list+independent_segments -hls_segment_filename "/var/www/content/live_001/720p/seg_%05d.ts" "/var/www/content/live_001/720p/playlist.m3u8"
      '
    restart: unless-stopped

  scrubber-api:
    build:
      context: ./scrubber/api
    container_name: ott-scrubber-api
    environment:
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: "http://localhost:5173,http://localhost:5174"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ott_auth
      POSTGRES_USER: ott_user
      POSTGRES_PASSWORD: ott_password_2025
      JWT_SECRET: your_jwt_secret_key_change_this_in_production
      JWT_REFRESH_SECRET: your_refresh_secret_key_change_this_in_production
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ott_detection_2025
      CDN_SHARED_SECRET: your_cdn_secret_key_change_this_in_production
      EDGE_ID: edge-local
      EDGE_DEFAULT_URL: http://localhost:8081
      EDGE_KR_URL: http://localhost:8081
      EDGE_JP_URL: http://localhost:8081
      EDGE_SG_URL: http://localhost:8081
      EDGE_US_URL: http://localhost:8081
      UPLOAD_SOURCE_DIR: /var/www/source
      UPLOAD_THUMBNAIL_DIR: /var/www/thumbnails
    ports:
      - "3001:3001"
    volumes:
      - ./origin/hls:/var/www/hls
      - ./origin/source:/var/www/source
      - ./origin/thumbnails:/var/www/thumbnails
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      elasticsearch:
        condition: service_started
    restart: unless-stopped

  scrubber-gateway:
    build:
      context: ./scrubber
      dockerfile: Dockerfile.gateway
    container_name: ott-scrubber-gateway
    environment:
      EDGE_ID: edge-local
    ports:
      - "8081:80"
    volumes:
      - ./scrubber/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./scrubber/lua:/usr/local/openresty/nginx/lua:ro
      - scrubber_logs:/var/log/nginx
    depends_on:
      - origin-nginx
      - scrubber-api
    restart: unless-stopped

  detection-engine:
    build:
      context: ./detection/engine
    container_name: ott-detection-engine
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ott_detection_2025
    volumes:
      - scrubber_logs:/var/log/scrubber:ro
    depends_on:
      - neo4j
      - scrubber-gateway
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: ott-filebeat
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./log-system/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - scrubber_logs:/var/log/scrubber:ro
      - origin_logs:/var/log/origin:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - elasticsearch
      - scrubber-gateway
      - origin-nginx
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: ott-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  origin-web:
    build:
      context: ./origin/web
    container_name: ott-origin-web
    environment:
      VITE_API_URL: http://localhost:8081
      VITE_CDN_URL: http://localhost:8081
    ports:
      - "5173:3000"
    depends_on:
      - scrubber-api
      - scrubber-gateway
    restart: unless-stopped

  scrubber-console:
    build:
      context: ./scrubber/console
    container_name: ott-scrubber-console
    environment:
      VITE_API_URL: http://localhost:8081
    ports:
      - "5174:3000"
    depends_on:
      - scrubber-api
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  elasticsearch_data:
  scrubber_logs:
  origin_logs:
  filebeat_data:
