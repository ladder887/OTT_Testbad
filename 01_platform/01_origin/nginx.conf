user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format cdn_log '{'
                       '"timestamp":"$time_iso8601",'
                       '"remote_addr":"$remote_addr",'
                       '"client_ip":"$http_x_real_ip",'
                       '"user_id":"$arg_user_id",'
                       '"username":"$arg_user",'
                       '"request_method":"$request_method",'
                       '"request_uri":"$request_uri",'
                       '"query_string":"$query_string",'
                       '"status":"$status",'
                       '"body_bytes_sent":"$body_bytes_sent",'
                       '"http_referer":"$http_referer",'
                       '"http_user_agent":"$http_user_agent",'
                       '"http_x_forwarded_for":"$http_x_forwarded_for",'
                       '"request_time":"$request_time"'
                       '}';

    access_log /var/log/nginx/access.log cdn_log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    # HLS MIME types
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        video/mp4 mp4;
    }

    server {
        listen 80;
        server_name localhost;

        # CORS headers for streaming
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE' always;
        add_header Access-Control-Allow-Headers 'Range, Content-Type' always;
        add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;

        # LIVE media playlists are moving windows and must never be cached.
        location ~ ^/hls/live_.*/(master\.m3u8|.*/playlist\.m3u8)$ {
            root /var/www;
            try_files $uri =404;

            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range, Content-Type' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
        }

        # A LIVE segment is immutable after publication, although the playlist rolls.
        location ~ ^/hls/live_.*/.*/seg_.*\.ts$ {
            root /var/www;
            try_files $uri =404;

            add_header Cache-Control "public, max-age=300, immutable" always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range, Content-Type' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
            add_header Accept-Ranges bytes;
        }

        # Uploaded VOD playlists and segments are immutable during a collection.
        location /hls {
            alias /var/www/hls;

            add_header Cache-Control "public, max-age=3600, immutable" always;
            add_header Access-Control-Allow-Origin * always;
            
            # Enable range requests for MP4
            add_header Accept-Ranges bytes;
            
            # MIME types
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
                video/mp4 mp4;
            }
        }

        # Thumbnails
        location /thumbnails {
            alias /var/www/thumbnails;
            add_header Cache-Control "public, max-age=86400" always;
            add_header Access-Control-Allow-Origin * always;
            
            types {
                image/jpeg jpg;
                image/png png;
            }
        }

        # Static HTML files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
