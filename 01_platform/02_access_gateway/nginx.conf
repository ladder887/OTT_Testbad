env EDGE_ID;
env VERIFY_API_URL;
env VERIFY_API_TIMEOUT_MS;
env VERIFY_CACHE_TTL_SEC;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Keep the address observed by the gateway. The TNSM experiment uses
    # container-level ipvlan addresses and does not accept identity overrides.
    map $remote_addr $client_real_ip {
        default $remote_addr;
    }

    map $client_real_ip $client_region {
        default "UNKNOWN";
        "~^192\.168\.10\." "KR";
        "~^192\.168\.20\." "JP";
        "~^192\.168\.30\." "SG";
        "~^192\.168\.40\." "US";
    }

    map $upstream_cache_status $cache_status {
        default $upstream_cache_status;
        "" "-";
    }

    # 상세 로그 포맷 (리칭 탐지용 - 실제 IP 수집 + 네트워크 패턴)
    log_format ott_access_json '{'
                            '"timestamp":"$time_iso8601",'
                            '"client_ip":"$client_real_ip",'
                            '"client_region":"$client_region",'
                            '"edge_server":"$edge_server",'
                            '"remote_addr":"$remote_addr",'
                            '"x_forwarded_for":"$http_x_forwarded_for",'
                            '"request_method":"$request_method",'
                            '"uri":"$uri",'
                            '"request_uri":"$request_uri",'
                            '"query_string":"$query_string",'
                            '"status":"$status",'
                            '"bytes_sent":"$bytes_sent",'
                            '"response_time_ms":"$request_time",'
                            '"token_user_id":"$token_user_id",'
                            '"token_session_id":"$token_session_id",'
                            '"token_content_id":"$token_content_id",'
                            '"token_issued_at":"$token_issued_at",'
                            '"token_expires":"$token_expires",'
                            '"token_ttl_sec":"$token_ttl_sec",'
                            '"token_ttl_remaining_sec":"$token_ttl_remaining_sec",'
                            '"token_valid":"$token_valid",'
                            '"token_edge_match":"$token_edge_match",'
                            '"token_label":"$token_label",'
                            '"token_run_id":"$token_run_id",'
                            '"token_scenario_id":"$token_scenario_id",'
                            '"token_dataset_label":"$token_dataset_label",'
                            '"token_device_id":"$token_device_id",'
                            '"token_logical_client_id":"$token_logical_client_id",'
                            '"token_physical_host_id":"$token_physical_host_id",'
                            '"token_network_profile_id":"$token_network_profile_id",'
                            '"http_referer":"$http_referer",'
                            '"http_user_agent":"$http_user_agent",'
                            '"session_token":"$arg_token",'
                            '"content_id":"$arg_content_id",'
                            '"username":"$arg_user",'
                            '"user_id":"$arg_user_id",'
                            '"client_id":"$arg_client_id",'
                            '"upstream_response_time":"$upstream_response_time",'
                            '"connection":"$connection",'
                            '"connection_requests":"$connection_requests",'
                            '"http_range":"$http_range",'
                            '"range_header":"$http_range",'
                            '"cache_status":"$cache_status",'
                            '"request_id":"$msec-$connection-$connection_requests",'
                            '"http_connection":"$http_connection",'
                            '"http_accept":"$http_accept",'
                            '"http_accept_language":"$http_accept_language"'
                            '}';

    access_log /var/log/nginx/access.log ott_access_json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    # 블랙리스트 (동적으로 업데이트 가능)
    geo $blocked_ip {
        default 0;
        # 예시: 10.0.0.1 1;
    }

    # Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $arg_token zone=by_token:10m rate=50r/s;
    lua_shared_dict token_verify_cache 20m;
    proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:20m max_size=2g inactive=15m use_temp_path=off;

    # Upstream - Origin Server
    upstream origin_backend {
        server origin-nginx:80;
        keepalive 32;
    }

    # Upstream - Access API
    upstream access_api {
        server access-api:3001;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # 콘텐츠 업로드(멀티파트)를 위해 요청 본문 크기를 충분히 허용한다.
        client_max_body_size 2g;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Scenario-Label, X-Run-ID, X-Scenario-ID, X-Dataset-Label, X-Device-ID, X-Logical-Client-ID, X-Physical-Host-ID, X-Network-Profile-ID, Range' always;
        add_header Access-Control-Max-Age 3600 always;

        # Upstream(origin)의 CORS 헤더를 숨겨 중복 Access-Control-* 응답을 방지
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Expose-Headers;

        set $edge_server "edge-local";
        set $token_user_id "-";
        set $token_session_id "-";
        set $token_content_id "-";
        set $token_issued_at "-";
        set $token_expires "-";
        set $token_ttl_sec "0";
        set $token_ttl_remaining_sec "0";
        set $token_valid "false";
        set $token_edge_match "false";
        set $token_label "normal";
        set $token_run_id "-";
        set $token_scenario_id "-";
        set $token_dataset_label "-";
        set $token_device_id "-";
        set $token_logical_client_id "-";
        set $token_physical_host_id "-";
        set $token_network_profile_id "-";

        # OPTIONS 메서드 처리 (CORS preflight)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # IP 블랙리스트 체크
        if ($blocked_ip) {
            return 403;
        }

        # Rate Limiting 적용
        limit_req zone=general burst=20 nodelay;

        # 라이브 매니페스트는 자주 변경되므로 짧은 캐시를 사용
        location ~ ^/hls/live_.*/(master\.m3u8|.*/playlist\.m3u8)$ {
            access_by_lua_file /usr/local/openresty/nginx/lua/auth_check.lua;
            limit_req zone=by_token burst=10 nodelay;

            proxy_cache off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;

            proxy_pass http://origin_backend;
            proxy_http_version 1.1;

            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header X-Session-Token $http_x_session_token;
            proxy_set_header X-Content-ID $http_x_content_id;
            proxy_set_header X-User-ID $token_user_id;
            proxy_set_header X-Playback-Session $token_session_id;
        }

        # 라이브 세그먼트는 생성 후 변경되지 않으므로 길게 캐시
        location ~ ^/hls/live_.*/.*/seg_.*\.ts$ {
            access_by_lua_file /usr/local/openresty/nginx/lua/auth_check.lua;
            limit_req zone=by_token burst=10 nodelay;

            proxy_cache cdn_cache;
            proxy_cache_valid 200 300s;
            proxy_cache_use_stale updating;

            proxy_pass http://origin_backend;
            proxy_http_version 1.1;

            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header X-Session-Token $http_x_session_token;
            proxy_set_header X-Content-ID $http_x_content_id;
            proxy_set_header X-User-ID $token_user_id;
            proxy_set_header X-Playback-Session $token_session_id;
        }

        # HLS 스트리밍 프록시
        location /hls {
            access_by_lua_file /usr/local/openresty/nginx/lua/auth_check.lua;

            # Rate limiting by token
            limit_req zone=by_token burst=10 nodelay;

            # Origin 서버로 프록시
            proxy_pass http://origin_backend;
            proxy_http_version 1.1;
            
            # 실제 클라이언트 IP 전달 (중요!)
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header X-Session-Token $http_x_session_token;
            proxy_set_header X-Content-ID $http_x_content_id;
            proxy_set_header X-User-ID $token_user_id;
            proxy_set_header X-Playback-Session $token_session_id;
            
            # 버퍼링 최소화 (실시간 스트리밍)
            proxy_buffering off;
            
            # 타임아웃
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
        }

        # 썸네일 이미지 프록시
        location /thumbnails {
            # Origin 서버로 프록시
            proxy_pass http://origin_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 캐싱 설정
            proxy_cache_valid 200 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # Access API proxy
        location /api {
            proxy_pass http://access_api;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Edge-ID $edge_server;
            proxy_set_header Connection "";

            # 대용량 파일 업로드 시 디스크 버퍼링으로 인한 지연/오류를 줄인다.
            proxy_request_buffering off;
            proxy_buffering off;
            # 업로드 후 FFmpeg 변환이 길어질 수 있으므로 업스트림 타임아웃을 충분히 늘린다.
            proxy_connect_timeout 15s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"access-gateway"}';
            add_header Content-Type application/json;
        }

        # 기본 페이지
        location / {
            return 200 '{"message":"Access Gateway","version":"1.0","endpoints":["/hls","/api","/health"]}';
            add_header Content-Type application/json;
        }
    }
}
