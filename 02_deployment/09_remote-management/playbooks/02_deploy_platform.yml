---
- name: Start Analysis Storage
  hosts: analysis_storage
  gather_facts: false
  become: false

  pre_tasks:
    - name: Load closed-lab settings
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/lab.yml"
        name: lab_settings

    - name: Require the Neo4j technical minimum
      ansible.builtin.assert:
        that:
          - lab_settings.lab_neo4j_password | length >= 8
        fail_msg: inventory/lab.yml must use at least 8 characters for Neo4j.

  tasks:
    - name: Write Analysis Storage environment
      ansible.builtin.copy:
        dest: "{{ project_root }}/{{ deployment_path }}/.env"
        mode: "0600"
        content: |
          NEO4J_PASSWORD={{ lab_settings.lab_neo4j_password }}

    - name: Validate Analysis Storage Compose
      ansible.builtin.command:
        argv: [docker, compose, config, --quiet]
        chdir: "{{ project_root }}/{{ deployment_path }}"
      changed_when: false

    - name: Start Analysis Storage
      ansible.builtin.command:
        argv: [docker, compose, up, -d]
        chdir: "{{ project_root }}/{{ deployment_path }}"
      changed_when: true

    - name: Wait for Elasticsearch
      ansible.builtin.uri:
        url: http://127.0.0.1:9200
        status_code: 200
      register: elasticsearch_health
      retries: 30
      delay: 5
      until: elasticsearch_health.status == 200

    - name: Install the event ingestion timestamp pipeline
      ansible.builtin.uri:
        url: http://127.0.0.1:9200/_ingest/pipeline/ott-event-ingest-timestamp
        method: PUT
        body_format: json
        body:
          description: Preserve Elasticsearch ingestion time separately from the original event time.
          processors:
            - set:
                field: event.ingested
                value: "{{ '{{{_ingest.timestamp}}}' }}"
        status_code: [200]

- name: Start Origin and API without changing media
  hosts: origin_api
  gather_facts: false
  become: false

  pre_tasks:
    - name: Load closed-lab settings
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/lab.yml"
        name: lab_settings

    - name: Require all closed-lab settings
      ansible.builtin.assert:
        that:
          - lab_settings[item] | length > 0
        fail_msg: Set every required value in inventory/lab.yml.
      loop:
        - lab_postgres_password
        - lab_neo4j_password
        - lab_jwt_secret
        - lab_jwt_refresh_secret
        - lab_cdn_shared_secret
        - lab_ott_admin_password
        - lab_ott_test_password

    - name: Inspect configured media directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ origin_hls_dir }}"
        - "{{ origin_source_dir }}"
        - "{{ origin_thumbnail_dir }}"
      register: media_directories

    - name: Require existing media directories
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: >-
          {{ item.item }} does not exist. Set the actual Origin path in
          inventory/group_vars/all/main.yml. Ansible will not create or move
          media automatically.
      loop: "{{ media_directories.results }}"

  tasks:
    - name: Write Origin and API environment
      ansible.builtin.copy:
        dest: "{{ project_root }}/{{ deployment_path }}/.env"
        mode: "0600"
        content: |
          POSTGRES_PASSWORD={{ lab_settings.lab_postgres_password }}
          NEO4J_PASSWORD={{ lab_settings.lab_neo4j_password }}
          JWT_SECRET={{ lab_settings.lab_jwt_secret }}
          JWT_REFRESH_SECRET={{ lab_settings.lab_jwt_refresh_secret }}
          CDN_SHARED_SECRET={{ lab_settings.lab_cdn_shared_secret }}
          OTT_ADMIN_PASSWORD={{ lab_settings.lab_ott_admin_password }}
          OTT_TEST_PASSWORD={{ lab_settings.lab_ott_test_password }}
          ORIGIN_HLS_DIR={{ origin_hls_dir }}
          ORIGIN_SOURCE_DIR={{ origin_source_dir }}
          ORIGIN_THUMBNAIL_DIR={{ origin_thumbnail_dir }}

    - name: Validate Origin and API Compose
      ansible.builtin.command:
        argv: [docker, compose, config, --quiet]
        chdir: "{{ project_root }}/{{ deployment_path }}"
      changed_when: false

    - name: Start Origin and API
      ansible.builtin.command:
        argv: [docker, compose, up, -d, --build]
        chdir: "{{ project_root }}/{{ deployment_path }}"
      changed_when: true

    - name: Recreate Origin Nginx to refresh its single-file bind mount
      ansible.builtin.command:
        argv: [docker, compose, up, -d, --force-recreate, origin-nginx]
        chdir: "{{ project_root }}/{{ deployment_path }}"
      changed_when: true

    - name: Validate the bind-mounted Origin Nginx configuration
      ansible.builtin.command:
        argv: [docker, exec, ott-origin-nginx, nginx, -t]
      changed_when: false

    - name: Reload Origin Nginx after configuration changes
      ansible.builtin.command:
        argv: [docker, exec, ott-origin-nginx, nginx, -s, reload]
      changed_when: true

    - name: Wait for API
      ansible.builtin.uri:
        url: http://127.0.0.1:3001/health
        status_code: 200
      register: api_health
      retries: 30
      delay: 5
      until: api_health.status == 200

    - name: Wait for Origin Nginx
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/health
        status_code: 200
      register: origin_health
      retries: 12
      delay: 5
      until: origin_health.status == 200

- name: Start Edge gateways one at a time
  hosts: edge_nodes
  serial: 1
  gather_facts: false
  become: false

  tasks:
    - name: Validate Edge Compose
      ansible.builtin.command:
        argv: [docker, compose, config, --quiet]
        chdir: "{{ project_root }}/{{ deployment_path }}"
      changed_when: false

    - name: Recreate Edge with the current bind-mounted configuration
      ansible.builtin.command:
        argv: [docker, compose, up, -d, --build, --force-recreate]
        chdir: "{{ project_root }}/{{ deployment_path }}"
      changed_when: true

    - name: Wait for Edge health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        status_code: 200
      register: edge_health
      retries: 12
      delay: 5
      until: edge_health.status == 200

- name: Start Graph Processing
  hosts: graph_processing
  gather_facts: false
  become: false

  pre_tasks:
    - name: Load closed-lab settings
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/lab.yml"
        name: lab_settings

    - name: Require the Neo4j technical minimum
      ansible.builtin.assert:
        that:
          - lab_settings.lab_neo4j_password | length >= 8
        fail_msg: inventory/lab.yml must use at least 8 characters for Neo4j.

  tasks:
    - name: Write Graph Pipeline environment
      ansible.builtin.copy:
        dest: "{{ project_root }}/{{ deployment_path }}/.env"
        mode: "0600"
        content: |
          NEO4J_PASSWORD={{ lab_settings.lab_neo4j_password }}

    - name: Validate Graph Pipeline Compose
      ansible.builtin.command:
        argv: [docker, compose, config, --quiet]
        chdir: "{{ project_root }}/{{ deployment_path }}"
      changed_when: false

    - name: Start Graph Pipeline
      ansible.builtin.command:
        argv: [docker, compose, up, -d, --build]
        chdir: "{{ project_root }}/{{ deployment_path }}"
      changed_when: true

    - name: Require Graph Pipeline container to be running
      ansible.builtin.command:
        argv: [docker, inspect, -f, "{{ '{{.State.Running}}' }}", ott-graph-pipeline-central]
      register: graph_pipeline_running
      changed_when: false
      retries: 12
      delay: 5
      until: graph_pipeline_running.stdout | trim == "true"
