---
- name: Generate and start 10 logical clients on each Raspberry Pi
  hosts: client_nodes
  serial: 2
  gather_facts: false
  become: false

  pre_tasks:
    - name: Load closed-lab settings
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/lab.yml"
        name: lab_settings

    - name: Require the test account value
      ansible.builtin.assert:
        that:
          - lab_settings.lab_ott_test_password | length > 0
        fail_msg: Set lab_ott_test_password in inventory/lab.yml.

    - name: Check configured data interface
      ansible.builtin.stat:
        path: "/sys/class/net/{{ client_parent_interface }}"
      register: client_interface

    - name: Require configured data interface
      ansible.builtin.assert:
        that:
          - client_interface.stat.exists
        fail_msg: >-
          {{ client_parent_interface }} does not exist on {{ inventory_hostname }}.

  tasks:
    - name: Generate canonical logical-client inventory
      ansible.builtin.command:
        argv:
          - python3
          - 03_experiments/03_orchestration/generate_logical_client_inventory.py
        chdir: "{{ project_root }}"
      changed_when: true

    - name: Validate generated inventory
      ansible.builtin.command:
        argv:
          - python3
          - 03_experiments/05_validation/validate_inventory.py
          - 03_experiments/07_generated/logical_clients.json
        chdir: "{{ project_root }}"
      changed_when: false

    - name: Build logical-client image
      ansible.builtin.command:
        argv:
          - docker
          - build
          - -t
          - "{{ logical_client_image }}"
          - 03_experiments/01_client_runtime
        chdir: "{{ project_root }}"
      changed_when: true

    - name: Write Pi-specific Compose environment
      ansible.builtin.copy:
        dest: >-
          {{ project_root }}/03_experiments/07_generated/{{
          physical_host_id }}/.env
        mode: "0600"
        content: |
          CLIENT_PARENT_INTERFACE={{ client_parent_interface }}
          LOGICAL_CLIENT_IMAGE={{ logical_client_image }}
          OTT_TEST_PASSWORD={{ lab_settings.lab_ott_test_password }}

    - name: Validate Pi-specific Compose
      ansible.builtin.command:
        argv: [docker, compose, config, --quiet]
        chdir: >-
          {{ project_root }}/03_experiments/07_generated/{{
          physical_host_id }}
      changed_when: false

    - name: Start logical clients
      ansible.builtin.command:
        argv: [docker, compose, up, -d]
        chdir: >-
          {{ project_root }}/03_experiments/07_generated/{{
          physical_host_id }}
      changed_when: true

    - name: Read logical-client service names
      ansible.builtin.command:
        argv: [docker, compose, config, --services]
        chdir: >-
          {{ project_root }}/03_experiments/07_generated/{{
          physical_host_id }}
      register: logical_client_services
      changed_when: false

    - name: Require 10 configured logical clients
      ansible.builtin.assert:
        that:
          - logical_client_services.stdout_lines | length == logical_clients_per_host
        fail_msg: >-
          {{ inventory_hostname }} has
          {{ logical_client_services.stdout_lines | length }} configured services;
          expected {{ logical_clients_per_host }}.

    - name: Require every assigned network profile to apply
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - exec
          - -T
          - "{{ item }}"
          - python
          - /app/client_agent.py
          - show-config
        chdir: >-
          {{ project_root }}/03_experiments/07_generated/{{
          physical_host_id }}
      loop: "{{ logical_client_services.stdout_lines }}"
      loop_control:
        label: "{{ inventory_hostname }} / {{ item }}"
      changed_when: false

    - name: Count running logical clients
      ansible.builtin.command:
        argv: [docker, compose, ps, --status, running, --quiet]
        chdir: >-
          {{ project_root }}/03_experiments/07_generated/{{
          physical_host_id }}
      register: running_clients
      changed_when: false

    - name: Require 10 running logical clients
      ansible.builtin.assert:
        that:
          - running_clients.stdout_lines | length == logical_clients_per_host
        fail_msg: >-
          {{ inventory_hostname }} has {{ running_clients.stdout_lines | length }}
          running logical clients; expected {{ logical_clients_per_host }}.
