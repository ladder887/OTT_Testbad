---
all:
  vars:
    ansible_user: ottadmin
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/ott_lab_ed25519"

  children:
    platform_nodes:
      children:
        origin_api:
        analysis_storage:
        graph_processing:
        edge_nodes:

    origin_api:
      hosts:
        ott-origin:
          ansible_host: 192.168.0.101
          expected_hostname: ott-origin
          deployment_path: 02_deployment/02_origin-api
          required_services:
            - postgres
            - origin-nginx
            - access-api
            - origin-web

    analysis_storage:
      hosts:
        ott-storage:
          ansible_host: 192.168.0.120
          expected_hostname: ott-storage
          deployment_path: 02_deployment/03_analysis-storage
          required_services:
            - neo4j
            - elasticsearch
            - kibana

    graph_processing:
      hosts:
        ott-processing:
          ansible_host: 192.168.0.130
          expected_hostname: ott-processing
          deployment_path: 02_deployment/04_graph-pipeline
          required_services:
            - graph-pipeline

    edge_nodes:
      hosts:
        ott-edge-1:
          ansible_host: 192.168.0.111
          expected_hostname: ott-edge-1
          edge_id: edge-kr
          deployment_path: 02_deployment/05_edge-kr
          required_services: [edge, filebeat]
        ott-edge-2:
          ansible_host: 192.168.0.112
          expected_hostname: ott-edge-2
          edge_id: edge-jp
          deployment_path: 02_deployment/06_edge-jp
          required_services: [edge, filebeat]
        ott-edge-3:
          ansible_host: 192.168.0.113
          expected_hostname: ott-edge-3
          edge_id: edge-sg
          deployment_path: 02_deployment/07_edge-sg
          required_services: [edge, filebeat]
        ott-edge-4:
          ansible_host: 192.168.0.114
          expected_hostname: ott-edge-4
          edge_id: edge-us
          deployment_path: 02_deployment/08_edge-us
          required_services: [edge, filebeat]

    client_nodes:
      vars:
        client_parent_interface: eth0
      hosts:
        ott-user1:
          ansible_host: 192.168.0.131
          expected_hostname: ott-user1
          physical_host_id: pi01
        ott-user2:
          ansible_host: 192.168.0.132
          expected_hostname: ott-user2
          physical_host_id: pi02
        ott-user3:
          ansible_host: 192.168.0.133
          expected_hostname: ott-user3
          physical_host_id: pi03
        ott-user4:
          ansible_host: 192.168.0.134
          expected_hostname: ott-user4
          physical_host_id: pi04
        ott-user5:
          ansible_host: 192.168.0.135
          expected_hostname: ott-user5
          physical_host_id: pi05
        ott-user6:
          ansible_host: 192.168.0.136
          expected_hostname: ott-user6
          physical_host_id: pi06
        ott-user7:
          ansible_host: 192.168.0.137
          expected_hostname: ott-user7
          physical_host_id: pi07
        ott-user8:
          ansible_host: 192.168.0.138
          expected_hostname: ott-user8
          physical_host_id: pi08
        ott-user9:
          ansible_host: 192.168.0.139
          expected_hostname: ott-user9
          physical_host_id: pi09
        ott-user10:
          ansible_host: 192.168.0.140
          expected_hostname: ott-user10
          physical_host_id: pi10
