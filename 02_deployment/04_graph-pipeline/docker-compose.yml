name: ott-graph-processing

services:
  graph-pipeline:
    build:
      context: ../../01_platform/05_graph_pipeline/service
    container_name: ott-graph-pipeline-central
    environment:
      LOG_SOURCE: elasticsearch
      ELASTICSEARCH_URL: http://192.168.0.120:9200
      ELASTICSEARCH_INDEX: access-gateway-nginx-*,scrubber-nginx-*,filebeat-*,.ds-access-gateway-nginx-*,.ds-scrubber-nginx-*,.ds-filebeat-*,ott-api-events-*
      ES_POLL_SIZE: 5000
      ES_ALLOWED_LATENESS_SEC: 180
      ES_SCROLL_KEEPALIVE: 1m
      NEO4J_URI: bolt://192.168.0.120:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      NEO4J_DATABASE: neo4j
      LOG_LEVEL: INFO
      ENABLE_OPERATIONAL_AUDIT: "false"
      VIEWING_SESSION_IDLE_TIMEOUT_SEC: 120
      LIVE_VIEWING_SESSION_IDLE_TIMEOUT_SEC: 45
      GRAPH_PIPELINE_STATE_FILE: /var/lib/graph-pipeline/checkpoint.json
    volumes:
      - graph_pipeline_state:/var/lib/graph-pipeline
    restart: unless-stopped

volumes:
  graph_pipeline_state:
