name: ott-origin-api

services:
  postgres:
    image: postgres:15-alpine
    container_name: ott-postgres
    environment:
      POSTGRES_DB: ott_auth
      POSTGRES_USER: ott_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      OTT_ADMIN_PASSWORD: "${OTT_ADMIN_PASSWORD:?OTT_ADMIN_PASSWORD is required}"
      OTT_TEST_PASSWORD: "${OTT_TEST_PASSWORD:?OTT_TEST_PASSWORD is required}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../01_platform/03_database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ott_user -d ott_auth"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  origin-nginx:
    image: nginx:1.25-alpine
    container_name: ott-origin-nginx
    ports:
      - "8080:80"
    volumes:
      - ../../01_platform/01_origin/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${ORIGIN_HLS_DIR:-../../01_platform/01_origin/hls}:/var/www/hls:ro
      - ${ORIGIN_THUMBNAIL_DIR:-../../01_platform/01_origin/thumbnails}:/var/www/thumbnails:ro
      - ../../01_platform/01_origin/html:/usr/share/nginx/html:ro
      - origin_logs:/var/log/nginx
    restart: unless-stopped

  live-encoder:
    image: linuxserver/ffmpeg:latest
    container_name: ott-live-encoder
    profiles:
      - managed-live-encoder
    environment:
      LIVE_SOURCE_FILE: /source/sample.mp4
    volumes:
      - ${ORIGIN_HLS_DIR:-../../01_platform/01_origin/hls}:/var/www/content
      - ${ORIGIN_SOURCE_DIR:-../../01_platform/01_origin/source}:/source
    entrypoint: /bin/sh
    command: |
      -lc '
      set -e;
      SRC="$${LIVE_SOURCE_FILE:-/source/sample.mp4}";
      mkdir -p /var/www/content/live_001/1080p /var/www/content/live_001/720p;
      cat > /var/www/content/live_001/master.m3u8 <<"EOF"
      #EXTM3U
      #EXT-X-STREAM-INF:BANDWIDTH=3128000,RESOLUTION=1920x1080,NAME="1080p"
      1080p/playlist.m3u8
      #EXT-X-STREAM-INF:BANDWIDTH=1596000,RESOLUTION=1280x720,NAME="720p"
      720p/playlist.m3u8
      EOF
      while [ ! -f "$$SRC" ]; do
        echo "Waiting for live source file: $$SRC";
        sleep 5;
      done;
      ffmpeg -re -stream_loop -1 -i "$$SRC" -c:v libx264 -preset ultrafast -b:v 3000k -c:a aac -b:a 128k -f hls -hls_time 2 -hls_list_size 12 -hls_flags delete_segments+append_list+independent_segments+omit_endlist -hls_segment_filename "/var/www/content/live_001/1080p/seg_%05d.ts" "/var/www/content/live_001/1080p/playlist.m3u8" &
      ffmpeg -re -stream_loop -1 -i "$$SRC" -c:v libx264 -preset ultrafast -vf scale=1280:720 -b:v 1500k -c:a aac -b:a 96k -f hls -hls_time 2 -hls_list_size 12 -hls_flags delete_segments+append_list+independent_segments+omit_endlist -hls_segment_filename "/var/www/content/live_001/720p/seg_%05d.ts" "/var/www/content/live_001/720p/playlist.m3u8"
      '
    restart: unless-stopped

  access-api:
    build:
      context: ../../01_platform/02_access_gateway/api
    container_name: ott-access-api
    environment:
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://192.168.0.101:5173,http://192.168.0.101
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ott_auth
      POSTGRES_USER: ott_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}"
      CDN_SHARED_SECRET: "${CDN_SHARED_SECRET:?CDN_SHARED_SECRET is required}"
      MAX_UPLOAD_FILE_SIZE_MB: 2048
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-200}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      LIVE_HLS_TIME_SEC: 2
      LIVE_HLS_LIST_SIZE: 30
      ELASTICSEARCH_URL: http://192.168.0.120:9200
      NEO4J_URI: bolt://192.168.0.120:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      EDGE_ID: edge-local
      EDGE_KR_ID: edge-kr
      EDGE_JP_ID: edge-jp
      EDGE_SG_ID: edge-sg
      EDGE_US_ID: edge-us
      EDGE_DEFAULT_ID: edge-kr
      EDGE_DEFAULT_URL: http://192.168.0.111
      EDGE_KR_URL: http://192.168.0.111
      EDGE_JP_URL: http://192.168.0.112
      EDGE_SG_URL: http://192.168.0.113
      EDGE_US_URL: http://192.168.0.114
      UPLOAD_SOURCE_DIR: /var/www/source
      UPLOAD_THUMBNAIL_DIR: /var/www/thumbnails
    ports:
      - "3001:3001"
    volumes:
      - ${ORIGIN_HLS_DIR:-../../01_platform/01_origin/hls}:/var/www/hls
      - ${ORIGIN_SOURCE_DIR:-../../01_platform/01_origin/source}:/var/www/source
      - ${ORIGIN_THUMBNAIL_DIR:-../../01_platform/01_origin/thumbnails}:/var/www/thumbnails
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  origin-web:
    build:
      context: ../../01_platform/01_origin/web
    container_name: ott-origin-web
    environment:
      VITE_API_URL: http://192.168.0.111
      VITE_API_UPLOAD_URL: http://192.168.0.101:3001
      VITE_CDN_URL: http://192.168.0.111
    ports:
      - "5173:3000"
    depends_on:
      - access-api
    restart: unless-stopped

volumes:
  postgres_data:
  origin_logs:
