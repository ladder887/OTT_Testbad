env EDGE_ID;
env VERIFY_API_URL;
env VERIFY_API_TIMEOUT_MS;
env VERIFY_CACHE_TTL_SEC;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Keep the source address observed at the Edge. Query/header overrides would
    # invalidate logical-client identity and are intentionally unsupported.
    map $remote_addr $client_real_ip {
        default $remote_addr;
    }

    map $client_real_ip $client_region {
        default "UNKNOWN";
        "~^192\.168\.0\.1[1-9]$" "KR";
        "~^192\.168\.0\.2[1-9]$" "JP";
        "~^192\.168\.0\.3[1-9]$" "SG";
        "~^192\.168\.0\.4[1-9]$" "US";
    }

    map $upstream_cache_status $cache_status {
        default $upstream_cache_status;
        "" "-";
    }

    log_format ott_access_json escape=json '{'
                            '"timestamp":"$time_iso8601",'
                            '"event_time_epoch":"$msec",'
                            '"event_source":"edge-nginx",'
                            '"client_ip":"$client_real_ip",'
                            '"client_region":"$client_region",'
                            '"edge_server":"$edge_server",'
                            '"remote_addr":"$remote_addr",'
                            '"x_forwarded_for":"$http_x_forwarded_for",'
                            '"request_method":"$request_method",'
                            '"uri":"$uri",'
                            '"request_uri":"$uri",'
                            '"query_string":"-",'
                            '"status":"$status",'
                            '"bytes_sent":"$bytes_sent",'
                            '"request_time_sec":"$request_time",'
                            '"token_jti":"$token_jti",'
                            '"cdn_token_id":"$cdn_token_id",'
                            '"token_owner_account_id":"$token_owner_account_id",'
                            '"token_owner_auth_session_id":"$token_owner_auth_session_id",'
                            '"token_playback_id":"$token_playback_id",'
                            '"token_owner_device_id":"$token_owner_device_id",'
                            '"observed_device_id":"$http_x_device_id",'
                            '"token_content_id":"$token_content_id",'
                            '"token_issued_at":"$token_issued_at",'
                            '"token_expires":"$token_expires",'
                            '"token_ttl_sec":"$token_ttl_sec",'
                            '"token_ttl_remaining_sec":"$token_ttl_remaining_sec",'
                            '"token_valid":"$token_valid",'
                            '"token_edge_match":"$token_edge_match",'
                            '"http_referer":"$http_referer",'
                            '"http_user_agent":"$http_user_agent",'
                            '"session_token":"-",'
                            '"upstream_response_time":"$upstream_response_time",'
                            '"connection":"$connection",'
                            '"connection_requests":"$connection_requests",'
                            '"http_range":"$http_range",'
                            '"range_header":"$http_range",'
                            '"cache_status":"$cache_status",'
                            '"request_id":"$edge_server-$msec-$connection-$connection_requests",'
                            '"http_connection":"$http_connection",'
                            '"http_accept":"$http_accept",'
                            '"http_accept_language":"$http_accept_language"'
                            '}';

    access_log /var/log/nginx/access.log ott_access_json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    geo $blocked_ip {
        default 0;
    }

    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $arg_token zone=by_token:10m rate=50r/s;
    lua_shared_dict token_verify_cache 20m;
    proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:20m max_size=8g inactive=15m use_temp_path=off;

    upstream origin_backend {
        server 192.168.0.101:8080;
        keepalive 32;
    }

    upstream access_api {
        server 192.168.0.101:3001;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # 콘텐츠 업로드(멀티파트)를 위해 요청 본문 크기를 충분히 허용한다.
        client_max_body_size 2g;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Device-ID, Range' always;
        add_header Access-Control-Max-Age 3600 always;

        # Hide upstream CORS headers to avoid duplicate Access-Control-* on proxied responses.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Expose-Headers;

        set_by_lua_block $edge_server {
            return os.getenv("EDGE_ID") or "edge-unknown"
        }
        set $token_jti "-";
        set $cdn_token_id "-";
        set $token_owner_account_id "-";
        set $token_owner_auth_session_id "-";
        set $token_playback_id "-";
        set $token_owner_device_id "-";
        set $token_content_id "-";
        set $token_issued_at "-";
        set $token_expires "-";
        set $token_ttl_sec "0";
        set $token_ttl_remaining_sec "0";
        set $token_valid "false";
        set $token_edge_match "false";

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        if ($blocked_ip) {
            return 403;
        }

        limit_req zone=general burst=20 nodelay;

        # Live manifests are moving windows. Do not cache them; a stale playlist can
        # reference segments that have already been removed by the live encoder.
        location ~ ^/hls/live_.*/(master\.m3u8|.*/playlist\.m3u8)$ {
            access_by_lua_file /usr/local/openresty/nginx/lua/auth_check.lua;
            limit_req zone=by_token burst=10 nodelay;

            proxy_cache off;
            # A location-level add_header stops inheritance of the server-level
            # CORS headers, so repeat them alongside the live cache policy.
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Device-ID, Range' always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;

            proxy_pass http://origin_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header X-Session-Token $http_x_session_token;
            proxy_set_header X-Content-ID $http_x_content_id;
            proxy_set_header X-User-ID $token_owner_account_id;
            proxy_set_header X-Playback-Session $token_playback_id;
        }

        # Live segments are immutable once written, so longer cache is safe.
        location ~ ^/hls/live_.*/.*/seg_.*\.ts$ {
            access_by_lua_file /usr/local/openresty/nginx/lua/auth_check.lua;
            limit_req zone=by_token burst=10 nodelay;

            proxy_cache cdn_cache;
            proxy_cache_key "$scheme$proxy_host$uri";
            proxy_cache_valid 200 300s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            proxy_pass http://origin_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header X-Session-Token $http_x_session_token;
            proxy_set_header X-Content-ID $http_x_content_id;
            proxy_set_header X-User-ID $token_owner_account_id;
            proxy_set_header X-Playback-Session $token_playback_id;
        }

        location /hls {
            access_by_lua_file /usr/local/openresty/nginx/lua/auth_check.lua;
            limit_req zone=by_token burst=10 nodelay;

            # VOD playlists and segments are immutable after upload. Authenticate
            # every request, then cache by resource URI rather than signed token.
            proxy_cache cdn_cache;
            proxy_cache_key "$scheme$proxy_host$uri";
            proxy_cache_valid 200 206 60m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            proxy_pass http://origin_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header X-Session-Token $http_x_session_token;
            proxy_set_header X-Content-ID $http_x_content_id;
            proxy_set_header X-User-ID $token_owner_account_id;
            proxy_set_header X-Playback-Session $token_playback_id;

            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
        }

        location /thumbnails {
            proxy_pass http://origin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location /api {
            proxy_pass http://access_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Edge-ID $edge_server;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 15s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"access-gateway"}';
            add_header Content-Type application/json;
        }

        location / {
            return 200 '{"message":"Access Gateway","version":"1.1","topology":"physical-edge-split"}';
            add_header Content-Type application/json;
        }
    }
}
